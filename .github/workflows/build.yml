---
name: Build caddy with addons

on:
  workflow_dispatch:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish-image:
    name: Build and publish image

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      # Only main publishes. Other branches build as a CI check and push nothing.
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read Caddy version from Dockerfile
        id: caddy
        run: |
          version=$(sed -n 's|^FROM docker.io/caddy:\([0-9]*\.[0-9]*\.[0-9]*\)-alpine@.*|\1|p' Dockerfile)
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error file=Dockerfile::Expected exactly one 'FROM docker.io/caddy:X.Y.Z-alpine@sha256:...' line, got: '${version}'"
            exit 1
          fi
          minor="${version%.*}"
          major="${version%%.*}"
          echo "caddy version=${version} minor=${minor} major=${major} publish=${PUBLISH}"
          {
            echo "version=${version}"
            echo "minor=${minor}"
            echo "major=${major}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.caddy.outputs.version }}
            type=raw,value=${{ steps.caddy.outputs.minor }}
            type=raw,value=${{ steps.caddy.outputs.major }}
            type=raw,value=latest
            type=sha,prefix=${{ steps.caddy.outputs.version }}-,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/arm/v8,linux/arm64,linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          labels: ${{ steps.meta.outputs.labels }}
          context: .
